<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--=============== GOOGLE FONTS ===============-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Text&family=DM+Sans:opsz,wght@9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Terminal v3</title>
  </head>
  <body>
    <div class="wrapper">
      <!-- Table code -->
      <div class="modal">
        <form action="" class="save__form">
          <textarea class="save__textarea" name="" id=""></textarea>
          <button class="ready">Сохранить в локал</button>
          <button class="close-modal"><i class="ri-close-line"></i></button>
        </form>
      </div>
      <div class="btns">
        <button class="add-data">Добавить данные</button>
        <button class="filter">Фильтровать</button>
        <button class="show-all">Показать все</button>
        <button class="show-info">Инфо</button>
      </div>

      <ul class="tanks"></ul>
      <!-- INFO BLOCK -->
      <section class="info">
        <textarea class="info__textarea" id="myText" rows="10" cols="50"></textarea>
        <input type="file" id="fileInput" accept=".json,application/json" hidden />

        <div class="info__btns">
          <button class="info__btns" onclick="saveJSON()"><i class="ri-save-2-line"></i></button>
          <button class="info__btns" onclick="readJSON()">
            <i class="ri-folder-open-line"></i>
          </button>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
